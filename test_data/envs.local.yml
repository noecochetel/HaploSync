name: haplosync-test
channels:
  - conda-forge
  - bioconda
  - main
  - defaults
dependencies:
  # Python
  - python>=3.8
  - cython
  - networkx
  - pandas
  - scipy
  - numpy
  - toml
  - pyyaml
  - matplotlib
  - biopython

  # R base
  - r-base

  # R packages
  - r-curl
  - r-tidyverse
  - r-optparse
  - r-plotly
  - r-plyr
  - r-flexdashboard
  - r-gridextra
  - r-devtools
  - r-knitr
  - r-svglite
  - r-gridsvg
  - r-svgpanzoom
  - r-ggrepel

  # Bioinformatics tools
  # NOTE: blat and gmap are omitted here (no osx-arm64 builds for the pinned
  # versions in nextflow/envs/haplosync.yml). Neither is needed for this local
  # test: blat is unused dead code (only mentioned in a comment/help string),
  # and gmap is only invoked by HaploDup's GMAP gene-mapping step, which only
  # runs when a --gff3 annotation is supplied (not used in this test).
  - minimap2
  - samtools
  - bedtools
  - mummer4

  # Utilities
  - parallel

  # Nextflow itself (not in the production env file)
  - nextflow
