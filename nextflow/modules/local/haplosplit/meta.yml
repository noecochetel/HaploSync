# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "haplosplit"
description: Legacy monolithic HaploSplit entry point (superseded by build_paths/reconstruct/translate, kept for standalone use)
keywords:
  - haplosync
  - genome assembly
tools:
  - "HaploSplit.py":
      description: "Part of the HaploSync pipeline (HaploSplit.py)"
      documentation: "https://github.com/noecochetel/HaploSync"
input:
  - []
output:
  - versions:
      type: file
      description: Tool version YAML
  - hap1_fasta:
      type: file
      description: Hap1 pseudomolecule FASTA
  - hap2_fasta:
      type: file
      description: Hap2 pseudomolecule FASTA
  - un_fasta:
      type: file
      description: Unplaced sequences FASTA
  - agp:
      type: file
      description: Reconstructed pseudomolecule AGP
  - correspondence:
      type: file
      description: Chromosome Hap1/Hap2 correspondence TSV
  - markers_bed:
      type: file
      description: Marker positions translated into pseudomolecule space (optional)
  - legacy_agp:
      type: file
      description: Legacy coordinate-mapping AGP (optional)
  - annotation:
      type: file
      description: Gene annotation translated into pseudomolecule space (optional)
authors:
  - "@noecochetel"
maintainers:
  - "@noecochetel"
