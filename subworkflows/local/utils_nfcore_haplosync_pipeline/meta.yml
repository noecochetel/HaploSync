# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "utils_nfcore_haplosync_pipeline"
description: Subworkflow with functionality specific to the HaploSync pipeline
keywords:
  - utility
  - pipeline
  - initialise
  - version
components:
  - utils_nextflow_pipeline
  - utils_nfcore_pipeline
  - utils_nfschema_plugin
input:
  - version:
      type: boolean
      description: Display version and exit
  - validate_params:
      type: boolean
      description: Validate parameters against the schema at runtime
  - monochrome_logs:
      type: boolean
      description: Do not use coloured log outputs
  - nextflow_cli_args:
      type: list
      description: List of positional nextflow CLI args
  - outdir:
      type: directory
      description: The output directory where the results will be saved
  - help:
      type: boolean
      description: Display help message and exit
  - help_full:
      type: boolean
      description: Show the full help message
  - show_hidden:
      type: boolean
      description: Show hidden parameters in the help message
output:
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@noecochetel"
maintainers:
  - "@noecochetel"
