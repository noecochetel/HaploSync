name: Run nf-test
on:
  push:
    branches: [nextflow-port]
    paths-ignore:
      - "docs/**"
      - "**/meta.yml"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/meta.yml"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NXF_ANSI_LOG: false

jobs:
  nf-test:
    name: "nf-test | conda | NXF ${{ matrix.NXF_VER }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Nextflow versions: check pipeline minimum and current latest
        NXF_VER:
          - "25.04.0"
          - ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge,bioconda

      - name: Install nf-test
        uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2

      - name: Run nf-test
        run: nf-test test --profile conda

      - name: Dump gap-fill diagnostics on failure
        if: failure()
        run: |
          echo "::group::Resolved bioinformatics tool versions (per created conda env)"
          find .nf-test -maxdepth 4 -type d -path "*/work/conda/env-*" | while read -r envdir; do
            echo "=== $envdir ==="
            for tool in nucmer show-coords gmap minimap2 samtools bedtools mosdepth; do
              bin="$envdir/bin/$tool"
              if [ -x "$bin" ]; then
                echo "-- $tool --"
                "$bin" --version 2>&1 | head -3
              fi
            done
            py="$envdir/bin/python"
            if [ -x "$py" ]; then
              echo "-- python/numpy/scipy/networkx --"
              "$py" --version 2>&1
              "$py" -c "import numpy, scipy, networkx; print('numpy', numpy.__version__); print('scipy', scipy.__version__); print('networkx', networkx.__version__)" 2>&1
            fi
          done
          echo "::endgroup::"

          echo "::group::nucmer/show-coords stderr logs (*.err)"
          find .nf-test -iname "*.err" -not -path "*/plugins/*" -not -path "*/conda/*" | while read -r f; do
            echo "=== $f ==="
            cat "$f"
            echo
          done
          echo "::endgroup::"

          echo "::group::nucmer coords/delta file inventory and contents"
          find .nf-test \( -iname "*.coords" -o -iname "*.delta" \) -not -path "*/conda/*" | while read -r f; do
            echo "=== $f ($(wc -l < "$f") lines, $(wc -c < "$f") bytes) ==="
            head -30 "$f"
            echo
          done
          echo "::endgroup::"

          echo "::group::Coverage-derived reliability category signal (chr3 *.cat.bed.gz only - RLE, compact)"
          find .nf-test -iname "*chr3*.cat.bed.gz" -not -path "*/conda/*" | while read -r f; do
            echo "=== $f ==="
            zcat "$f" 2>/dev/null
            echo
          done
          echo "::endgroup::"
